<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录 · 潮汐窗口与安全余压闭环</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 16px; margin: 16px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button:disabled { background: #a9bdc0; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    textarea { min-height: 52px; }
    label { display: block; margin: 8px 0 4px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    .tile { background: #f1f8f9; border: 1px solid #d3e3e5; border-radius: 8px; padding: 8px; text-align: center; }
    .tile b { display: block; font-size: 20px; }
    .tile span { font-size: 12px; color: #5c7378; }
    .map { position: relative; height: 520px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.85); }
    .marker.st-invalid { opacity: .45; filter: grayscale(.6); }
    .marker.st-approved { border-color: #bff3c9; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item.st-invalid { opacity: .65; background: #f6f6f6; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.p-pending { background: #fdf3d8; border-color: #e4c46a; color: #7a5b10; }
    .pill.p-approved { background: #ddf6e3; border-color: #7fcf93; color: #1c6b35; }
    .pill.p-invalid { background: #ececec; border-color: #c4c4c4; color: #6b6b6b; }
    .muted { color: #5c7378; font-size: 13px; }
    .gate { border: 1px solid #c9dadc; border-radius: 8px; padding: 10px; margin: 8px 0; background: #f7fafb; display: grid; gap: 5px; }
    .gate.pass { border-color: #7fcf93; background: #eefaf1; }
    .gate.fail { border-color: #e0a77e; background: #fdf3ec; }
    .check { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .check.ok { color: #1c6b35; }
    .check.bad { color: #9a421a; }
    .gate-msg { font-size: 13px; font-weight: 700; }
    .gate.pass .gate-msg { color: #1c6b35; }
    .gate.fail .gate-msg { color: #9a421a; }
    .closed-tag { font-size: 12px; font-weight: 800; color: #1d6c78; }
    .review { border: 1px dashed #c9dadc; border-radius: 8px; padding: 10px; margin-top: 10px; display: grid; gap: 4px; }
    .review.approved { border-style: solid; border-color: #7fcf93; background: #f1fbf4; }
    .review.invalid { border-style: solid; border-color: #c4c4c4; background: #f6f6f6; }
    .rv-badge { font-weight: 800; }
    .review.approved .rv-badge { color: #1c6b35; }
    .review.invalid .rv-badge { color: #6b6b6b; }
    .review.pending .rv-badge { color: #7a5b10; }
    .checkline { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .checkline input { width: auto; }
    .blockers { margin: 4px 0 8px 18px; padding: 0; color: #9a421a; font-size: 13px; }
    .blockers:empty { display: none; }
    fieldset { border: 1px solid #d7e4e5; border-radius: 8px; margin: 10px 0; padding: 10px; }
    legend { font-weight: 800; padding: 0 6px; }
    @media (max-width: 1020px) {
      header { display: block; }
      .app { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录</h1>
      <div class="muted">潮汐窗口与安全余压闭环：登记潜次 → 安全门槛 → 标记待复核 → 换人核对实际出水时间 → 闭潜计入时间线。</div>
    </div>
    <button id="exportBtn">导出JSON</button>
  </header>
  <main class="app">
    <section>
      <div id="stats" class="stats"></div>
      <div class="panel">
        <div class="map" id="map"><div class="wreck"></div></div>
        <div class="muted" style="margin-top:6px">点击平面图落点新增标记。✓ 复核通过 · 文字 待复核 · ✕ 已失效（随潜次改动失效）。</div>
      </div>
    </section>
    <aside class="panel">
      <fieldset>
        <legend>潜次登记（计划时段 · 两名潜水员 · 起返压）</legend>
        <div class="row2">
          <div>
            <label>选择潜次</label>
            <select id="diveSelect"></select>
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" id="newDiveBtn" class="secondary" style="width:100%">登记新潜次</button>
          </div>
        </div>
        <form id="diveForm">
          <input name="id" type="hidden">
          <label>潜次编号</label><input name="code" required placeholder="例如 DIVE-03">
          <div class="row2">
            <div><label>计划开始</label><input name="plannedStart" type="datetime-local"></div>
            <div><label>计划结束</label><input name="plannedEnd" type="datetime-local"></div>
          </div>
          <div class="row2">
            <div><label>潜水员 1</label><input name="diver1" placeholder="姓名"></div>
            <div><label>潜水员 2（潜伴）</label><input name="diver2" placeholder="姓名"></div>
          </div>
          <div class="row2">
            <div><label>起始压力（巴）</label><input name="startPressure" type="number" min="0" step="1"></div>
            <div><label>返回压力 / 余压（巴）</label><input name="endPressure" type="number" min="0" step="1"></div>
          </div>
          <div class="row2">
            <div><label>潮高（米，上限 0.8）</label><input name="tideHeight" type="number" min="0" step="0.01"></div>
            <div><label>实际出水时间</label><input name="actualExit" type="datetime-local"></div>
          </div>
          <div id="gate" class="gate"></div>
          <div class="row2">
            <button>保存潜次登记</button>
            <button type="button" id="closeDiveBtn" class="secondary">登记闭潜</button>
          </div>
        </form>
      </fieldset>

      <form id="markForm">
        <h2>标记信息</h2>
        <fieldset id="markFields">
          <input name="id" type="hidden">
          <div class="row2">
            <div><label>编号</label><input name="code" required></div>
            <div>
              <label>所属潜次</label>
              <select name="diveId"></select>
            </div>
          </div>
          <label>类型</label>
          <select name="type">
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
          <div class="row2">
            <div><label>深度</label><input name="depth" placeholder="18.4m"></div>
            <div><label>朝向</label><input name="orientation" placeholder="东北偏北"></div>
          </div>
          <label>保存状态</label><input name="condition" placeholder="表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
        </fieldset>
        <div class="row2">
          <button id="saveMarkBtn">保存标记</button>
          <button type="button" id="deleteMarkBtn" class="secondary">删除标记</button>
        </div>
      </form>

      <div id="reviewBox" class="review"></div>

      <h2 id="listTitle">标记列表</h2>
      <div class="toolbar">
        <select id="filterType">
          <option value="">全部类型</option>
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="pending">待复核</option>
          <option value="approved">已通过</option>
          <option value="invalid">已失效</option>
        </select>
        <select id="view">
          <option value="list">标记列表</option>
          <option value="timeline">潜次时间线</option>
        </select>
      </div>
      <div id="list" class="list"></div>
    </aside>
  </main>

  <script src="js/rules.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
